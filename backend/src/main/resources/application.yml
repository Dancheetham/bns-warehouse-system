server:
  port: 8080
  servlet:
    session:
      # Long-lived by default - this is trusted LAN/warehouse-floor
      # infrastructure (login screens are shared devices used all shift),
      # not a public-internet app where short sessions matter more.
      timeout: 30d
      cookie:
        max-age: 30d

spring:
  application:
    name: warehouse-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bnswarehouse}
    username: ${DB_USER:bnsadmin}
    password: ${DB_PASSWORD:bnsadmin}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        # Helps Hibernate group inserts/updates more efficiently for bulk
        # operations like the stock import - note this doesn't fully collapse
        # into true multi-row SQL batches for StockItem specifically, since it
        # uses IDENTITY id generation (a well-known JPA limitation: the DB has
        # to hand back each generated id before the next insert), but it still
        # meaningfully reduces overhead versus no batching config at all.
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  level:
    uk.co.bns.warehouse_api: DEBUG

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app:
  test-data-reset:
    # Off by default - deliberately requires an explicit env var so a "Reset Test Data"
    # button can never appear (or be called) unless someone has turned it on for this
    # specific environment. See docker-compose.yml.
    enabled: ${ALLOW_TEST_DATA_RESET:false}

# Optional - product sync only pulls from Shopify (read_products scope), never
# writes back. Leave shop-domain blank to disable entirely - no scheduled polling
# and the Sync Now button reports "not configured" rather than failing.
#
# client-id/client-secret are the app's OAuth credentials (Dev Dashboard > your
# app > App settings > Credentials) - used only server-side to complete the
# "Connect to Shopify" handshake once, in ShopifyOAuthService. The actual access
# token that comes out of that handshake is stored dynamically (via Settings),
# not as an env var - see ShopifyOAuthService/ShopifyOAuthController.
shopify:
  shop-domain: ${SHOPIFY_SHOP_DOMAIN:}
  client-id: ${SHOPIFY_CLIENT_ID:}
  client-secret: ${SHOPIFY_CLIENT_SECRET:}
  # Shopify only supports each quarterly API version for ~12 months, then
  # silently "falls forward" to whatever's oldest-currently-supported on any
  # call still pinned to a sunset version - no error, no warning, just a
  # different schema than the one actually being coded against. Worth
  # bumping this deliberately every couple of quarters rather than
  # discovering it's stale by accident.
  api-version: 2026-04

# Optional - leave SMTP_HOST blank to run without email actually sending.
# When blank, the Acknowledgement action still composes and shows the email
# content but is honest that it wasn't delivered, rather than pretending to send it.
mail:
  smtp-host: ${SMTP_HOST:}
  smtp-port: ${SMTP_PORT:587}
  smtp-username: ${SMTP_USERNAME:}
  smtp-password: ${SMTP_PASSWORD:}
  from-address: ${MAIL_FROM_ADDRESS:sales@bnsdistribution.example}
