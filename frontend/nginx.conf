server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /downloads/ {
        # nginx has no built-in MIME type for .apk (would otherwise serve it
        # as application/octet-stream, which works but isn't explicit), and
        # this folder only ever holds the Android APK, so applying this to
        # everything under it rather than needing a nested regex match.
        add_header Content-Disposition "attachment";
        default_type application/vnd.android.package-archive;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20M;
        # Default is 60s - genuinely too short for something like the bulk
        # stock import (42k+ rows). The backend itself has no timeout and
        # keeps working regardless, but the browser gives up and shows a
        # confusing 504 well before a large operation actually finishes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
